<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Samticalx | Interactive 3D Particle Experiment</title>
<style>
  :root{
    --bg:#0a0a0c;
    --panel:#111114cc;
    --line:#ffffff1a;
    --ink:#e8e6e1;
    --dim:#8a8780;
    --accent:#c9a27a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; background:var(--bg); overflow:hidden; font-family:'Iowan Old Style','Georgia',serif;}
  #scene{position:fixed; inset:0; z-index:1;}
  #webcam{
    position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1); z-index:0; opacity:0; transition:opacity .6s ease;
    filter:brightness(.55) saturate(.8);
  }
  #webcam.on{opacity:1;}

  .title{
    position:fixed; top:28px; left:32px; z-index:5;
    color:var(--ink); font-size:22px; letter-spacing:.04em; font-weight:400;
    pointer-events:none;
  }
  .title span{color:var(--dim); font-size:12px; display:block; letter-spacing:.18em; margin-top:4px; font-family:ui-monospace,monospace;}

  .hud{
    position:fixed; bottom:26px; left:32px; z-index:5;
    display:flex; gap:10px; align-items:flex-end;
  }
  .pill{
    background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(8px);
    padding:8px 14px; border-radius:20px; color:var(--dim); font-size:11px;
    font-family:ui-monospace,monospace; letter-spacing:.05em;
  }
  .pill b{color:var(--ink); font-weight:500;}

  #bgToggle{
    position:fixed; top:28px; right:32px; z-index:5;
    background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(8px);
    color:var(--ink); font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.08em;
    padding:9px 16px; border-radius:20px; cursor:pointer; transition:all .25s ease;
  }
  #bgToggle:hover{border-color:#ffffff44; background:#1a1a1ecc;}
  #bgToggle.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}

  #status{
    position:fixed; top:78px; right:32px; z-index:5;
    color:var(--dim); font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.05em;
    text-align:right; max-width:220px; line-height:1.6;
  }
  #status .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:#666; margin-right:6px;}
  #status .dot.live{background:#7cd48b; box-shadow:0 0 6px #7cd48b;}

  #loading{
    position:fixed; inset:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px;
    transition:opacity .6s ease;
  }
  #loading .ring{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite;}
  #loading p{color:var(--dim); font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.1em;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><p>REQUESTING CAMERA…</p></div>

<video id="webcam" autoplay muted playsinline></video>
<canvas id="scene"></canvas>

<div class="title">Particle Field
  <span>3000 PTS · HAND REACTIVE</span>
</div>

<div id="status">
  <div><span class="dot" id="camDot"></span><span id="camText">camera off</span></div>
  <div id="handText">no hands</div>
</div>

<button id="bgToggle">WEBCAM BACKGROUND</button>

<div class="hud">
  <div class="pill">1 hand — <b>move / rotate</b></div>
  <div class="pill">pinch hold — <b>charge → explode</b></div>
  <div class="pill">2 hands — <b>spread to scale</b></div>
  <div class="pill">fingers — <b>color</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
(function(){
  "use strict";

  /* ---------------- THREE SETUP ---------------- */
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0,0,7);

  const rootGroup = new THREE.Group();
  scene.add(rootGroup);

  const COUNT = 3000;
  const BASE_RADIUS = 2.2;

  // fibonacci sphere distribution
  const homePositions = new Float32Array(COUNT*3);
  const positions = new Float32Array(COUNT*3);
  const velocities = new Float32Array(COUNT*3);
  const explodeDir = new Float32Array(COUNT*3);
  const phase = new Float32Array(COUNT); // per-particle noise offset

  const golden = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<COUNT;i++){
    const y = 1 - (i/(COUNT-1))*2;
    const r = Math.sqrt(1-y*y);
    const theta = golden*i;
    const x = Math.cos(theta)*r;
    const z = Math.sin(theta)*r;
    homePositions[i*3]   = x*BASE_RADIUS;
    homePositions[i*3+1] = y*BASE_RADIUS;
    homePositions[i*3+2] = z*BASE_RADIUS;
    positions[i*3]   = homePositions[i*3];
    positions[i*3+1] = homePositions[i*3+1];
    positions[i*3+2] = homePositions[i*3+2];
    const len = Math.sqrt(x*x+y*y+z*z)||1;
    explodeDir[i*3]=x/len; explodeDir[i*3+1]=y/len; explodeDir[i*3+2]=z/len;
    phase[i] = Math.random()*Math.PI*2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));

  const colorPalettes = [
    [0.79,0.64,0.48], // 0 fingers - warm sand
    [0.49,0.75,0.55], // 1 - green
    [0.42,0.62,0.86], // 2 - blue
    [0.82,0.52,0.75], // 3 - magenta
    [0.92,0.72,0.34], // 4 - amber
    [0.88,0.35,0.35], // 5 - red
  ];
  let currentColor = new THREE.Color(colorPalettes[0][0],colorPalettes[0][1],colorPalettes[0][2]);
  let targetColor = currentColor.clone();

  const mat = new THREE.PointsMaterial({
    size: 0.028,
    color: currentColor,
    transparent:true,
    opacity:0.9,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
  });
  const points = new THREE.Points(geo, mat);
  rootGroup.add(points);

  // charge ring (pinch indicator)
  const ringGeo = new THREE.RingGeometry(1,1.04,64);
  const ringMat = new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0, side:THREE.DoubleSide});
  const chargeRing = new THREE.Mesh(ringGeo, ringMat);
  chargeRing.scale.set(0.001,0.001,0.001);
  scene.add(chargeRing);

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------------- STATE ---------------- */
  const state = {
    rotVel: {x:0.002, y:0.003},
    targetOffset: new THREE.Vector3(0,0,0),
    currentOffset: new THREE.Vector3(0,0,0),
    scale: 1,
    targetScale: 1,
    pinching:false,
    pinchStart:0,
    charge:0,
    exploded:false,
    explodeStart:0,
    reforming:false,
    reformStart:0,
    fingerCount:0,
  };

  const EXPLODE_DURATION = 900;   // ms outward
  const REFORM_DURATION = 1600;   // ms return
  const CHARGE_TIME = 750;        // ms hold to trigger

  /* ---------------- ANIMATE ---------------- */
  const clock = new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const now = performance.now();

    // idle rotation + hand-driven rotation
    rootGroup.rotation.y += state.rotVel.y;
    rootGroup.rotation.x += state.rotVel.x;

    // smooth position offset (hand moves sphere)
    state.currentOffset.lerp(state.targetOffset, 0.09);
    rootGroup.position.copy(state.currentOffset);

    // smooth scale (two-hand spread)
    state.scale += (state.targetScale - state.scale) * 0.08;
    rootGroup.scale.setScalar(state.scale);

    // color lerp
    currentColor.lerp(targetColor, 0.05);
    mat.color.copy(currentColor);

    // charge ring visuals
    if(state.pinching && !state.exploded){
      const elapsed = now - state.pinchStart;
      state.charge = Math.min(elapsed / CHARGE_TIME, 1);
      chargeRing.material.opacity = 0.15 + state.charge*0.65;
      const s = 0.9 + state.charge*0.9;
      chargeRing.scale.set(s,s,s);
      chargeRing.rotation.z += 0.05;
      chargeRing.lookAt(camera.position);
      mat.size = 0.028 + state.charge*0.01*Math.sin(t*20);
      if(state.charge >= 1){
        triggerExplode();
      }
    } else if(!state.exploded){
      chargeRing.material.opacity += (0 - chargeRing.material.opacity)*0.2;
    }

    // explode / reform particle animation
    const pos = geo.attributes.position.array;
    if(state.exploded){
      const el = now - state.explodeStart;
      const p = Math.min(el / EXPLODE_DURATION, 1);
      const ease = 1 - Math.pow(1-p, 3);
      for(let i=0;i<COUNT;i++){
        const idx = i*3;
        const spread = 3.5 + Math.sin(phase[i]*3)*1.5;
        pos[idx]   = homePositions[idx]   + explodeDir[idx]*ease*spread*2.2;
        pos[idx+1] = homePositions[idx+1] + explodeDir[idx+1]*ease*spread*2.2;
        pos[idx+2] = homePositions[idx+2] + explodeDir[idx+2]*ease*spread*2.2;
      }
      mat.opacity = 0.9 - ease*0.5;
      if(p>=1){
        state.exploded=false;
        state.reforming=true;
        state.reformStart=now;
      }
      geo.attributes.position.needsUpdate = true;
    } else if(state.reforming){
      const el = now - state.reformStart;
      const p = Math.min(el / REFORM_DURATION, 1);
      const ease = p<0.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
      for(let i=0;i<COUNT;i++){
        const idx=i*3;
        const spread = 3.5 + Math.sin(phase[i]*3)*1.5;
        const fx = homePositions[idx]   + explodeDir[idx]*spread*2.2;
        const fy = homePositions[idx+1] + explodeDir[idx+1]*spread*2.2;
        const fz = homePositions[idx+2] + explodeDir[idx+2]*spread*2.2;
        pos[idx]   = fx + (homePositions[idx]-fx)*ease;
        pos[idx+1] = fy + (homePositions[idx+1]-fy)*ease;
        pos[idx+2] = fz + (homePositions[idx+2]-fz)*ease;
      }
      mat.opacity = 0.4 + ease*0.5;
      if(p>=1){ state.reforming=false; mat.opacity=0.9; }
      geo.attributes.position.needsUpdate = true;
    } else {
      // gentle ambient breathing when idle at home position
      for(let i=0;i<COUNT;i++){
        const idx=i*3;
        const n = Math.sin(t*0.8 + phase[i]) * 0.02;
        pos[idx]   = homePositions[idx]   * (1+n*0.3);
        pos[idx+1] = homePositions[idx+1] * (1+n*0.3);
        pos[idx+2] = homePositions[idx+2] * (1+n*0.3);
      }
      geo.attributes.position.needsUpdate = true;
    }

    renderer.render(scene, camera);
  }
  animate();

  function triggerExplode(){
    state.exploded = true;
    state.explodeStart = performance.now();
    state.pinching = false;
    chargeRing.material.opacity = 0;
    state.charge = 0;
  }

  /* ---------------- HAND TRACKING ---------------- */
  const video = document.getElementById('webcam');
  const bgToggle = document.getElementById('bgToggle');
  const camDot = document.getElementById('camDot');
  const camText = document.getElementById('camText');
  const handText = document.getElementById('handText');
  const loading = document.getElementById('loading');

  let bgOn = false;
  bgToggle.addEventListener('click', ()=>{
    bgOn = !bgOn;
    video.classList.toggle('on', bgOn);
    bgToggle.classList.toggle('active', bgOn);
    bgToggle.textContent = bgOn ? 'WEBCAM BACKGROUND · ON' : 'WEBCAM BACKGROUND';
  });

  function dist3(a,b){
    const dx=a.x-b.x, dy=a.y-b.y, dz=(a.z||0)-(b.z||0);
    return Math.sqrt(dx*dx+dy*dy+dz*dz);
  }

  function countExtendedFingers(landmarks, handedness){
    // landmarks: 21 points, normalized image coords (x right, y down)
    let count = 0;
    const tips = [8,12,16,20];
    const pips = [6,10,14,18];
    for(let i=0;i<4;i++){
      if(landmarks[tips[i]].y < landmarks[pips[i]].y - 0.02) count++;
    }
    // thumb: compare x distance from palm, direction depends on handedness (mirrored view)
    const thumbTip = landmarks[4], thumbMcp = landmarks[2], wrist = landmarks[0];
    const thumbExtended = dist3(thumbTip, wrist) > dist3(thumbMcp, wrist) * 1.35;
    if(thumbExtended) count++;
    return count;
  }

  let hands;
  let mpCamera;
  let lastHandsCount = 0;

  function onResults(results){
    const lm = results.multiHandLandmarks || [];
    const n = lm.length;

    if(n === 0){
      camDot.classList.remove('live');
      handText.textContent = 'no hands';
      state.pinching = false;
      // drift back to center / neutral scale
      state.targetOffset.lerp(new THREE.Vector3(0,0,0), 1);
      return;
    }
    camDot.classList.add('live');

    if(n === 1){
      const h = lm[0];
      handText.textContent = '1 hand · move + rotate';

      // position: map hand center (wrist/palm avg) to world offset
      const cx = (h[0].x - 0.5) * -2;   // mirrored feed, flip x
      const cy = (h[0].y - 0.5) * -2;
      state.targetOffset.set(cx*2.4, cy*1.6, 0);

      // rotation speed driven by horizontal position (left/right spins faster)
      state.rotVel.y = 0.002 + cx*0.03;
      state.rotVel.x = 0.001 + cy*0.015;

      // finger count -> color
      const fc = countExtendedFingers(h);
      if(fc !== state.fingerCount){
        state.fingerCount = fc;
        const c = colorPalettes[Math.min(fc,5)];
        targetColor.setRGB(c[0],c[1],c[2]);
      }

      // pinch detection: thumb tip (4) to index tip (8)
      const pinchDist = dist3(h[4], h[8]);
      const isPinching = pinchDist < 0.045;

      if(isPinching && !state.exploded && !state.reforming){
        if(!state.pinching){
          state.pinching = true;
          state.pinchStart = performance.now();
          const midX = (h[4].x + h[8].x)/2 - 0.5;
          const midY = (h[4].y + h[8].y)/2 - 0.5;
          chargeRing.position.set(midX*-4.8, midY*-3.2, 0.5);
        } else {
          const midX = (h[4].x + h[8].x)/2 - 0.5;
          const midY = (h[4].y + h[8].y)/2 - 0.5;
          chargeRing.position.lerp(new THREE.Vector3(midX*-4.8, midY*-3.2, 0.5), 0.3);
        }
      } else if(!isPinching && state.pinching){
        state.pinching = false;
        chargeRing.material.opacity = 0;
        state.charge = 0;
      }

    } else if(n >= 2){
      handText.textContent = '2 hands · spread to scale';
      state.pinching = false;
      chargeRing.material.opacity = 0;

      const a = lm[0][9]; // middle finger MCP as palm center approx
      const b = lm[1][9];
      const spread = dist3(a,b); // 0..~1.4 normalized

      // map spread to scale
      const s = THREE.MathUtils.clamp(spread * 2.6, 0.4, 2.6);
      state.targetScale = s;

      // average position of both hands drives offset too
      const cx = ((a.x+b.x)/2 - 0.5) * -2;
      const cy = ((a.y+b.y)/2 - 0.5) * -2;
      state.targetOffset.set(cx*2.4, cy*1.6, 0);

      // combined finger count across both hands -> color (capped)
      const fc = Math.min(countExtendedFingers(lm[0]) + countExtendedFingers(lm[1]), 5);
      if(fc !== state.fingerCount){
        state.fingerCount = fc;
        const c = colorPalettes[fc];
        targetColor.setRGB(c[0],c[1],c[2]);
      }
    }
  }

  async function initHands(){
    hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({
      maxNumHands:2,
      modelComplexity:1,
      minDetectionConfidence:0.6,
      minTrackingConfidence:0.55,
    });
    hands.onResults(onResults);

    mpCamera = new Camera(video, {
      onFrame: async ()=>{ await hands.send({image:video}); },
      width:640, height:480,
    });
    await mpCamera.start();

    camText.textContent = 'camera live';
    loading.style.opacity = '0';
    setTimeout(()=>loading.style.display='none', 650);
  }

  initHands().catch(err=>{
    loading.querySelector('p').textContent = 'CAMERA ACCESS DENIED';
    camText.textContent = 'camera error';
    console.error(err);
  });

})();
</script>
</body>
</html>
